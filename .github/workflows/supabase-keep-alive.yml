name: Supabase Keep Alive

on:
  schedule:
    # Every six hours: 06:17, 12:17, 18:17, 00:17 KST.
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Query the database with bounded retries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}
        run: python3 scripts/supabase_healthcheck.py check

  keep-schedule-enabled:
    # Independent of database health; continue even when the project is down.
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Record repository activity when inactive for 30 days
        shell: bash
        run: |
          now=$(date +%s)
          last_commit=$(git log -1 --format=%ct)
          age=$((now - last_commit))

          if (( age < 2592000 )); then
            echo "The repository has activity within the last 30 days."
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keep-alive-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keep-alive-heartbeat.txt
          git commit -m 'chore: keep scheduled workflows active [skip ci]'
          # Rebase onto concurrent human commits; never force-push.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if (( attempt < 3 )); then
              sleep 5
              git pull --rebase
            fi
          done
          echo "::error::Repository activity update failed. Check branch protection and Actions write permissions."
          exit 1

  report:
    needs: [ping, keep-schedule-enabled]
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Report the entire run to the independent monitor
        env:
          KEEPALIVE_HEARTBEAT_URL: ${{ secrets.KEEPALIVE_HEARTBEAT_URL }}
          KEEPALIVE_RESULT: ${{ needs.ping.result == 'success' && needs.keep-schedule-enabled.result == 'success' && 'success' || 'failure' }}
        run: python3 scripts/supabase_healthcheck.py report
