name: Supabase Keep Alive

on:
  schedule:
    # GitHub Actions가 몰리는 정각을 피해 매주 수요일과 토요일에 실행
    - cron: '17 3 * * 3,6'
  workflow_dispatch:

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Validate Supabase secrets
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" ]]; then
            echo "::error::Repository secret SUPABASE_URL is missing."
            exit 1
          fi
          if [[ -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::Repository secret SUPABASE_KEY is missing."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "::error::SUPABASE_URL must be a valid https://*.supabase.co URL."
            exit 1
          fi

      - name: Send a request to Supabase
        shell: bash
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 20 \
            --max-time 90 \
            --request GET \
            "$SUPABASE_URL/rest/v1/quotes?select=id&limit=1" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Accept: application/json"
          echo
          echo "Supabase keep-alive request succeeded."

  keep-schedule-enabled:
    needs: ping
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Record repository activity when inactive for 30 days
        shell: bash
        run: |
          now=$(date +%s)
          last_commit=$(git log -1 --format=%ct)
          age=$((now - last_commit))

          if (( age < 2592000 )); then
            echo "The repository has activity within the last 30 days."
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keep-alive-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keep-alive-heartbeat.txt
          git commit -m 'chore: keep scheduled workflows active [skip ci]'
          git push
