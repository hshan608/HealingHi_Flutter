name: Supabase Safety Tests

on:
  push:
    paths:
      - '.github/workflows/supabase-*.yml'
      - 'scripts/supabase_healthcheck.py'
      - 'scripts/tests/**'
  pull_request:
    paths:
      - '.github/workflows/supabase-*.yml'
      - 'scripts/supabase_healthcheck.py'
      - 'scripts/tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test failure, recovery and alert behavior without secrets or network
        run: python3 -m unittest discover -s scripts/tests -v
